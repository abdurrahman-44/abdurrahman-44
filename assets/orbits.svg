<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img"><title>Orbiting technologies</title><style>text{font-family:monospace}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:pulse 1s steps(2) infinite}.spin{transform-origin:450px 145px;animation:spin 24s linear infinite}.scan{animation:scan 4s linear infinite}.dash{stroke-dasharray:5 12;animation:dash 2s linear infinite}.type{animation:type 7s steps(40) infinite}@keyframes type{0%{width:0}65%,100%{width:760px}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}@keyframes dash{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="edge"><stop stop-color="#818cf8"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="shine"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".15"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient></defs><rect x="2" y="2" width="896" height="276" rx="12" fill="#101323" stroke="url(#edge)" stroke-width="2"/><rect x="7" y="7" width="886" height="266" rx="9" fill="none" stroke="#818cf8" opacity=".25" class="pulse"/><text x="24" y="32" font-size="16" fill="#67e8f9" >TECH ORBITS / AI CORE</text><circle cx="450" cy="145" r="38" fill="#252344" stroke="#67e8f9" stroke-width="2" class="pulse"/><text x="450" y="151" font-size="22" fill="#e0e7ff" text-anchor="middle">AI</text><circle cx="450" cy="145" r="70" fill="none" stroke="#414c82" stroke-dasharray="3 5"/><circle cx="450" cy="145" r="105" fill="none" stroke="#414c82" stroke-dasharray="3 5"/><g transform="translate(450 145)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/><g transform="translate(70 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/><circle r="23" fill="#252344" stroke="#818cf8"/><text x="0" y="5" font-size="12" fill="#e0e7ff" text-anchor="middle">Py</text></g></g></g></g><g transform="translate(450 145)"><g><animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="18s" repeatCount="indefinite"/><g transform="translate(70 0)"><g><animateTransform attributeName="transform" type="rotate" from="-120" to="-480" dur="18s" repeatCount="indefinite"/><circle r="23" fill="#252344" stroke="#818cf8"/><text x="0" y="5" font-size="12" fill="#e0e7ff" text-anchor="middle">JS</text></g></g></g></g><g transform="translate(450 145)"><g><animateTransform attributeName="transform" type="rotate" from="240" to="600" dur="18s" repeatCount="indefinite"/><g transform="translate(70 0)"><g><animateTransform attributeName="transform" type="rotate" from="-240" to="-600" dur="18s" repeatCount="indefinite"/><circle r="23" fill="#252344" stroke="#818cf8"/><text x="0" y="5" font-size="12" fill="#e0e7ff" text-anchor="middle">TS</text></g></g></g></g><g transform="translate(450 145)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="720" dur="30s" repeatCount="indefinite"/><g transform="translate(105 0)"><g><animateTransform attributeName="transform" type="rotate" from="-360" to="-720" dur="30s" repeatCount="indefinite"/><circle r="23" fill="#252344" stroke="#818cf8"/><text x="0" y="5" font-size="12" fill="#e0e7ff" text-anchor="middle">React</text></g></g></g></g><g transform="translate(450 145)"><g><animateTransform attributeName="transform" type="rotate" from="480" to="840" dur="30s" repeatCount="indefinite"/><g transform="translate(105 0)"><g><animateTransform attributeName="transform" type="rotate" from="-480" to="-840" dur="30s" repeatCount="indefinite"/><circle r="23" fill="#252344" stroke="#818cf8"/><text x="0" y="5" font-size="12" fill="#e0e7ff" text-anchor="middle">SQL</text></g></g></g></g><g transform="translate(450 145)"><g><animateTransform attributeName="transform" type="rotate" from="600" to="960" dur="30s" repeatCount="indefinite"/><g transform="translate(105 0)"><g><animateTransform attributeName="transform" type="rotate" from="-600" to="-960" dur="30s" repeatCount="indefinite"/><circle r="23" fill="#252344" stroke="#818cf8"/><text x="0" y="5" font-size="12" fill="#e0e7ff" text-anchor="middle">Torch</text></g></g></g></g><text x="30" y="115" font-size="16" fill="#e0e7ff" >INPUT: curiosity</text><text x="30" y="145" font-size="16" fill="#e0e7ff" >OUTPUT: ideas</text><text x="650" y="145" font-size="15" fill="#86efac" >SYSTEM ONLINE</text></svg>