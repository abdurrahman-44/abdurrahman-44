<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img"><title>Holographic developer identity</title><style>text{font-family:monospace}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:pulse 1s steps(2) infinite}.spin{transform-origin:450px 145px;animation:spin 24s linear infinite}.scan{animation:scan 4s linear infinite}.dash{stroke-dasharray:5 12;animation:dash 2s linear infinite}.type{animation:type 7s steps(40) infinite}@keyframes type{0%{width:0}65%,100%{width:760px}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}@keyframes dash{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="edge"><stop stop-color="#818cf8"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="shine"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".15"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient></defs><rect x="2" y="2" width="896" height="256" rx="12" fill="#101323" stroke="url(#edge)" stroke-width="2"/><rect x="7" y="7" width="886" height="246" rx="9" fill="none" stroke="#818cf8" opacity=".25" class="pulse"/><text x="25" y="32" font-size="16" fill="#67e8f9" >IDENTITY / AZ-0044</text><rect x="28" y="52" width="160" height="160" rx="6" fill="#252344" stroke="#818cf8"/><text x="55" y="145" font-size="65" fill="#a5b4fc" >AZ</text><text x="220" y="87" font-size="30" fill="#e0e7ff" >Abdurrahman Zarook</text><text x="220" y="120" font-size="19" fill="#67e8f9" >AI undergraduate / Software developer</text><text x="220" y="151" font-size="17" fill="#e0e7ff" >NSBM Green University • Sri Lanka</text><text x="220" y="185" font-size="15" fill="#86efac" >STATUS: CONTINUOUS LEARNING</text><clipPath id="card"><rect x="10" y="10" width="880" height="240" rx="10"/></clipPath><g clip-path="url(#card)"><rect x="0" y="10" width="120" height="240" fill="url(#shine)" class="scan"/></g></svg>