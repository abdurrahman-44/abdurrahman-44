<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img"><title>Developer terminal</title><style>text{font-family:monospace}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:pulse 1s steps(2) infinite}.spin{transform-origin:450px 145px;animation:spin 24s linear infinite}.scan{animation:scan 4s linear infinite}.dash{stroke-dasharray:5 12;animation:dash 2s linear infinite}.type{animation:type 7s steps(40) infinite}@keyframes type{0%{width:0}65%,100%{width:760px}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}@keyframes dash{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="edge"><stop stop-color="#818cf8"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="shine"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".15"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient></defs><rect x="2" y="2" width="896" height="256" rx="12" fill="#101323" stroke="url(#edge)" stroke-width="2"/><rect x="7" y="7" width="886" height="246" rx="9" fill="none" stroke="#818cf8" opacity=".25" class="pulse"/><text x="24" y="32" font-size="15" fill="#67e8f9" >AZ / TERMINAL   •   SESSION ACTIVE</text><text x="28" y="68" font-size="19" fill="#c084fc" >$ whoami</text><text x="28" y="101" font-size="19" fill="#e0e7ff" >&gt; AI undergraduate | NSBM Green University</text><text x="28" y="134" font-size="19" fill="#c084fc" >$ focus --current</text><text x="28" y="167" font-size="19" fill="#e0e7ff" >&gt; Machine learning / computer vision / full-stack</text><text x="28" y="200" font-size="19" fill="#c084fc" >$ echo "Turning curiosity into code."</text><clipPath id="typing"><rect x="28" y="183" width="760" height="35" class="type"/></clipPath><text x="28" y="210" font-size="19" fill="#67e8f9" clip-path="url(#typing)">&gt; Build. Learn. Repeat. _</text><text x="28" y="240" font-size="12" fill="#818cf8" >// 42: curiosity is the answer</text></svg>